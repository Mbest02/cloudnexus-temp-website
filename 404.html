<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found (404) | CloudNexus</title>
  <meta name="description" content="The page you requested could not be found. Return to the CloudNexus homepage for managed IT, cybersecurity, and AI services in Louisville, KY." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#050807" />
  <link rel="canonical" href="https://cloudnexusit.com/" />
  <link rel="icon" type="image/png" href="logo.png" />
  <style>
    :root {
      --green: #8BC63F;
      --green-bright: #A6E24A;
      --green-dim: #4f7a24;
      --bg: #050807;
      --panel-solid: #0b120d;
      --text: #ffffff;
      --text-soft: #c2d1b6;
      --text-dim: #8fa382;
      --border: rgba(139, 198, 63, 0.22);
      --ring: #A6E24A;
      --mono: "SFMono-Regular", "Consolas", "Liberation Mono", "Menlo", "Courier New", monospace;
      --sans: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }
    * , *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      font-family: var(--sans);
      color: var(--text);
      line-height: 1.65;
      background-color: var(--bg);
      background-image:
        radial-gradient(1200px 700px at 50% -5%, rgba(139, 198, 63, 0.10), transparent 60%),
        radial-gradient(1400px 1000px at 50% 30%, transparent 40%, rgba(5, 8, 7, 0.9) 100%);
      overflow-x: hidden;
      text-align: center;
    }
    .wrap { max-width: 620px; width: 100%; }
    .logo {
      display: block;
      margin: 0 auto 32px;
      max-width: 300px;
      width: 70%;
      height: auto;
      filter: drop-shadow(0 0 16px rgba(139, 198, 63, 0.45));
    }
    .code {
      font-family: var(--mono);
      font-size: clamp(3rem, 14vw, 6rem);
      font-weight: 700;
      line-height: 1;
      color: var(--green-bright);
      text-shadow: 0 0 26px rgba(139, 198, 63, 0.35);
      margin: 0 0 8px;
      letter-spacing: 0.05em;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      line-height: 1.2;
      letter-spacing: -0.01em;
    }
    p {
      margin: 0 auto 28px;
      max-width: 48ch;
      color: var(--text-soft);
      font-size: 1.05rem;
    }
    .terminal {
      max-width: 520px;
      margin: 0 auto 30px;
      text-align: left;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      font-family: var(--mono);
    }
    .terminal-body { padding: 14px 18px; font-size: 0.9rem; color: var(--text-soft); }
    .terminal-body .prompt { color: var(--green); }
    .terminal-body .label { color: var(--green-bright); font-weight: 700; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 14px 30px;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
      color: #06210a;
      background: var(--green);
      box-shadow: 0 0 26px -8px rgba(139, 198, 63, 0.75);
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover { background: var(--green-bright); box-shadow: 0 0 32px -6px rgba(166, 226, 74, 0.9); }
    a:focus-visible, .btn:focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 3px;
      border-radius: 8px;
    }
    .foot {
      margin-top: 34px;
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .foot a { color: var(--green-bright); text-decoration: none; }
    .foot a:hover { color: #fff; text-decoration: underline; }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="logo.png" alt="CloudNexus logo" width="527" height="70" />
    <p class="code">404</p>
    <h1>Page Not Found</h1>
    <p>
      The page you're looking for doesn't exist or may have moved. Let's get you
      back on track.
    </p>

    <div class="terminal" role="status">
      <div class="terminal-body">
        <span class="prompt">$</span>
        <span class="label">ERROR&nbsp;404:</span>
        Resource not found. Redirect available below.
      </div>
    </div>

    <a class="btn" href="https://cloudnexusit.com/">Return to Homepage</a>

    <p class="foot">
      Need help? Call <a href="tel:+15024401380">502-440-1380</a>
      or email <a href="mailto:support@cloudnexusit.com">support@cloudnexusit.com</a>
    </p>
  </main>
</body>
</html>
